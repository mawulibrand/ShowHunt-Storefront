name: Foundation checks
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.6-alpine
        env:
          POSTGRES_USER: showhunt
          POSTGRES_PASSWORD: showhunt_local
          POSTGRES_DB: showhunt
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U showhunt -d showhunt"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: cp apps/api/.env.example apps/api/.env
      - run: pnpm db:migrate
      - run: pnpm db:migrate
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Vercel-style API startup regression
        run: node apps/api/scripts/smoke-vercel.mjs
      - name: API smoke test
        run: |
          pnpm --filter @showhunt/api start > /tmp/showhunt-api.log 2>&1 &
          trap 'kill $!' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail http://localhost:4000/health/live; then break; fi
            sleep 1
          done
          API_TEST_URL=http://localhost:4000 EXPECT_DB_READY=true pnpm --filter @showhunt/api test
      - run: pnpm audit --prod --audit-level high

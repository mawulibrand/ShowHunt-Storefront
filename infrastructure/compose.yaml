services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_USER: showhunt
      POSTGRES_PASSWORD: showhunt_local
      POSTGRES_DB: showhunt
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - showhunt_pg:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U showhunt -d showhunt']
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  showhunt_pg:
